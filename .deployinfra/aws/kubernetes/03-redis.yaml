# ============================================================
# REDIS DEPLOYMENT
# ============================================================
# Redis is REQUIRED for distributed LiveKit deployments.
# It provides:
# - Room state synchronization across nodes
# - Participant routing to correct server
# - Egress/Ingress job coordination
#
# For production, consider:
# - AWS ElastiCache for managed Redis
# - Redis Cluster for high availability
# - Persistent volumes for data durability
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: livekit
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Health checks
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          # Optional: Persistent storage
          # volumeMounts:
          #   - name: redis-data
          #     mountPath: /data
      # volumes:
      #   - name: redis-data
      #     persistentVolumeClaim:
      #       claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: livekit
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
---
# ============================================================
# OPTIONAL: Redis PersistentVolumeClaim
# ============================================================
# Uncomment if you need Redis persistence across restarts.
# For ephemeral room state, this is often not needed.
# ============================================================
