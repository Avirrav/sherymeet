# ============================================================
# INGRESS DEPLOYMENT
# ============================================================
# LiveKit Ingress handles external streams INTO rooms:
# - RTMP: OBS, FFmpeg, streaming software
# - WHIP: WebRTC-based ingress (browser streaming)
# - URL: Pull from HLS/RTSP sources
#
# Use cases:
# - Broadcasting from professional equipment
# - Simulcasting from external sources
# - Webinar-style one-to-many streaming
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  namespace: livekit
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/component: ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress
    spec:
      # Run on system nodes (not livekit nodes) to avoid port conflicts
      # LiveKit server already uses hostNetwork on livekit nodes
      tolerations:
        - key: "livekit.io/dedicated"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
        - name: ingress
          image: livekit/ingress:latest
          env:
            - name: INGRESS_CONFIG_FILE
              value: /etc/ingress/ingress.yaml
          ports:
            # RTMP port
            - containerPort: 1935
              protocol: TCP
              name: rtmp
            # WHIP port
            - containerPort: 8080
              protocol: TCP
              name: whip
            # HTTP relay
            - containerPort: 9090
              protocol: TCP
              name: http-relay
            # RTC UDP
            - containerPort: 7885
              protocol: UDP
              name: rtc-udp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/ingress
              readOnly: true
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          # Ingress doesn't have HTTP health endpoint - use TCP check
          livenessProbe:
            tcpSocket:
              port: 1935
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 1935
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: livekit-config
            items:
              - key: ingress.yaml
                path: ingress.yaml
