# ============================================================
# EGRESS DEPLOYMENT
# ============================================================
# LiveKit Egress handles recording and live streaming:
# - Room composite recording (all participants)
# - Track-based recording (individual tracks)
# - RTMP streaming to YouTube, Twitch, etc.
# - HLS streaming
#
# Architecture:
# - Runs headless Chrome to render the room
# - Captures video/audio and encodes with FFmpeg
# - Uploads to S3 or streams to RTMP endpoints
#
# Requirements:
# - CAP_SYS_ADMIN for Chrome sandbox
# - Significant CPU/memory for transcoding
# - Optional: GPU nodes for hardware encoding
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  namespace: livekit
  labels:
    app.kubernetes.io/name: egress
    app.kubernetes.io/component: egress
spec:
  # Egress pods are stateless - scale based on recording demand
  # Each pod needs 4 CPU, so 1 replica per c5.xlarge node max
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress
    spec:
      # Optional: Run on dedicated egress nodes with more CPU
      # nodeSelector:
      #   livekit.io/node-pool: egress

      # Allow scheduling on livekit nodes
      tolerations:
        - key: "livekit.io/dedicated"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
        - name: egress
          image: livekit/egress:latest
          env:
            - name: EGRESS_CONFIG_FILE
              value: /etc/egress/egress.yaml
          ports:
            # Health/metrics port
            - containerPort: 9090
              name: http
          resources:
            # 2 CPU works for basic recording (720p, single track)
            # For 1080p/composite, use larger nodes (c5.2xlarge+)
            requests:
              cpu: 2000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/egress
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Chrome sandbox requires SYS_ADMIN
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          livenessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: livekit-config
            items:
              - key: egress.yaml
                path: egress.yaml
        # Temp storage for recording files before upload
        - name: tmp
          emptyDir:
            sizeLimit: 50Gi
---
# ============================================================
# EGRESS HPA (Horizontal Pod Autoscaler)
# ============================================================
# Scales egress pods based on CPU usage.
# Recording is CPU-intensive, so scale when transcoding load increases.
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: egress-hpa
  namespace: livekit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: egress
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
