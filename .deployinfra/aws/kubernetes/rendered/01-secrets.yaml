# ============================================================
# SECRETS
# ============================================================
# Stores sensitive credentials for LiveKit services.
# In production, use AWS Secrets Manager with External Secrets
# Operator or sealed-secrets for GitOps workflows.
#
# IMPORTANT: Replace placeholder values before deploying!
# Generate secure values:
#   LIVEKIT_API_KEY: openssl rand -hex 8
#   LIVEKIT_API_SECRET: openssl rand -hex 32
#   REDIS_PASSWORD: openssl rand -hex 16
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: livekit-secrets
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # LiveKit API credentials - used by all services
  LIVEKIT_API_KEY: "cb83dd3a8ca3e998"
  LIVEKIT_API_SECRET: "9263380a86844e4dce3da4319e81ea08170e1c9eb31fbc8b4e1e3278a907b6e3"

  # Redis password for distributed state
  REDIS_PASSWORD: "Sherymeetstrong985"
---
