# ============================================================
# EKS CLUSTER CONFIGURATION
# ============================================================
# Generated by eks-setup.sh
# Cluster: sherymeet-cluster
# Region: ap-south-2
# VPC: vpc-04d03167204de5c6e (my-vpc)
# ============================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: sherymeet-cluster
  region: ap-south-2
  version: "1.31"
  tags:
    Environment: production
    Application: sherymeet
    ManagedBy: eksctl

# ============================================================
# IAM OIDC Provider
# ============================================================
# Required for IAM Roles for Service Accounts (IRSA)
# Used by: AWS Load Balancer Controller, Karpenter
iam:
  withOIDC: true

  # Service account for AWS Load Balancer Controller
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true

# ============================================================
# VPC Configuration (Using Existing VPC)
# ============================================================
# Reusing VPC: my-vpc (vpc-04d03167204de5c6e)
# This avoids creating duplicate NAT Gateways and saves cost
vpc:
  id: vpc-04d03167204de5c6e
  cidr: 10.0.0.0/16
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  subnets:
    public:
      ap-south-2a:
        id: subnet-07ee64daf7f238f7a
      ap-south-2b:
        id: subnet-0d3b0c8bc0bdda96b


# ============================================================
# Managed Node Groups
# ============================================================
managedNodeGroups:
  # ──────────────────────────────────────────────────────────
  # System Node Group
  # ──────────────────────────────────────────────────────────
  # Runs cluster add-ons: CoreDNS, kube-proxy, ALB controller
  - name: system-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 50
    volumeType: gp3

    labels:
      node-type: system

    tags:
      Name: sherymeet-cluster-system-node

    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true
        ebs: true

  # ──────────────────────────────────────────────────────────
  # LiveKit Node Group
  # ──────────────────────────────────────────────────────────
  # Dedicated nodes for LiveKit workloads
  # - Compute optimized instances for media processing
  # - Public IPs for WebRTC direct connections
  # - Labeled for DaemonSet node selection
  - name: livekit-nodes
    instanceType: c5.xlarge
    desiredCapacity: 2
    minSize: 1
    maxSize: 10
    volumeSize: 100
    volumeType: gp3

    # Labels for node selection
    labels:
      livekit.io/node-pool: livekit
      node-type: livekit

    # Taint to ensure only LiveKit pods run here
    taints:
      - key: livekit.io/dedicated
        value: "true"
        effect: NoSchedule

    tags:
      Name: sherymeet-cluster-livekit-node

    # SSH access (optional - for debugging)
    # ssh:
    #   allow: true
    #   publicKeyPath: ~/.ssh/id_rsa.pub

    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true
        ebs: true
        # For egress S3 uploads
        # externalDNS: true

# ============================================================
# Cluster Add-ons
# ============================================================
addons:
  - name: vpc-cni
    version: latest
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
    wellKnownPolicies:
      ebsCSIController: true

# ============================================================
# CloudWatch Logging
# ============================================================
cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
